spring:
  application:
    name: zaoral-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/zaoral}
    username: ${DATABASE_USERNAME:zaoral}
    password: ${DATABASE_PASSWORD:zaoral_dev_password}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
