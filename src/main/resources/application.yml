spring:
  application:
    name: zaoral-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/zaoral}
    # DMLのみ許可されたロール。スキーマの適用はDB作成プロセスの責務であり、
    # このアプリはDDLを打てない(実装ミスやSQLインジェクションでテーブルを壊せない)。
    # ロール定義は Zaoral-frontend の ops/db/init/01-roles.sql 参照
    username: ${DATABASE_USERNAME:zaoral_app}
    password: ${DATABASE_PASSWORD:zaoral_app_dev_password}
  jpa:
    hibernate:
      ddl-auto: none
      # 既定の命名戦略は引用符付きの "User" を "user" に小文字化してしまうため、名前をそのまま使う戦略にする。
      # カラム名はエンティティ側で @Column(name = ...) により明示する。
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
  # Flywayの設定は削除した。スキーマの適用はDB作成プロセス(Zaoral-frontend の
  # docker-compose の migrate サービス)が唯一の主体。SQLは ops/db/migration/ にある。
  # このアプリは起動時にスキーマを作らず、前提の検証のみ行う(QuotaConsistencyChecker)。

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

# アプリケーション固有の設定
zaoral:
  cron:
    # cronから呼ばれるエンドポイントの共有シークレット。
    # 未設定の場合、該当エンドポイントは常に401を返す(CronAuthorization 参照)。
    secret: ${CRON_SECRET:}
