spring:
  application:
    name: zaoral-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/zaoral}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
